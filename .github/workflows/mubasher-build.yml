name: Mubasher - Android APK
on:
  push:
    branches:
      - mubasher-apk-build-20261115
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Extract Mubasher 1.3
        run: tar -xJf Mubasher-source.tar.gz
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Install Android platform
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
      - name: Test playlist catalog
        working-directory: Mubasher
        run: python3 -m unittest discover -s tests -v
      - name: Refresh public streams (Arabic first, global categories)
        working-directory: Mubasher
        run: python3 tools/refresh_channels.py
      - name: Count real source listings
        working-directory: Mubasher
        run: grep -c '^#EXTINF:' app/src/main/assets/channels.m3u
      - name: Run Kotlin category tests and assemble debug APK
        working-directory: Mubasher
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mubasher-1.3-debug-apk
          path: Mubasher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
