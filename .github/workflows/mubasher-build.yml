name: Mubasher - Android APK
on:
  push:
    branches:
      - mubasher-apk-build-20261115
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Extract Mubasher Android project
        run: tar -xzf Mubasher-source.tar.gz
      - name: Fix Kotlin type inference in adapter initialization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Mubasher/app/src/main/java/com/mubasher/tv/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          before = 'private val adapter = ChannelAdapter { position ->'
          after = 'private val adapter: ChannelAdapter by lazy { ChannelAdapter { position: Int ->'
          assert s.count(before) == 1, 'Adapter initialization unexpectedly changed'
          s = s.replace(before, after, 1)
          end = '            playChannel(visible[position])\\n        }\\n    }\\n    private val handler'
          assert s.count(end) == 1, 'Adapter block ending unexpectedly changed'
          s = s.replace(end, '            playChannel(visible[position])\\n        }\\n    } }\\n    private val handler', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK without deprecated tools package
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Android platform 34
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
      - name: Verify playlist builder tests
        working-directory: Mubasher
        run: python3 -m unittest discover -s tests -v
      - name: Refresh current public IPTV channels
        working-directory: Mubasher
        run: python3 tools/refresh_channels.py
      - name: Assemble installable debug APK
        working-directory: Mubasher
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Mubasher-debug-apk
          path: Mubasher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
