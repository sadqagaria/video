name: Build Mubasher Android APK (isolated branch)

on:
  push:
    branches:
      - mubasher-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Mubasher
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4

      - name: Restore Mubasher Android project
        working-directory: .
        run: |
          base64 --decode Mubasher_source.tar.gz.base64 > /tmp/Mubasher.tar.gz
          tar -xzf /tmp/Mubasher.tar.gz
          test -f Mubasher/app/build.gradle.kts
          test -f Mubasher/app/src/main/assets/channels.m3u

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Install Android platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Unit-test channel catalog
        run: python3 -m unittest discover -s tests -v

      - name: Refresh public Arabic channel catalog
        run: python3 tools/refresh_channels.py

      - name: Print bundled stream count
        run: echo "Bundled channels $(grep -c '^#EXTINF:' app/src/main/assets/channels.m3u)"

      - name: Build Android debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Mubasher-debug-apk
          path: Mubasher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete project
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mubasher-source
          path: |
            Mubasher/README.md
            Mubasher/.github/workflows/build-apk.yml
            Mubasher/build.gradle.kts
            Mubasher/settings.gradle.kts
            Mubasher/gradle.properties
            Mubasher/app/
            Mubasher/tools/
            Mubasher/tests/
          retention-days: 30
