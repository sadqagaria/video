name: Mubasher - Android APK v1.4
on:
  push:
    branches:
      - mubasher-apk-build-20261115
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Extract working Mubasher base
        run: tar -xzf Mubasher-source.tar.gz
      - name: Apply v1.3 source update
        run: |
          xz -dc Mubasher-update.patch.xz > /tmp/mubasher-update.patch
          git apply --check /tmp/mubasher-update.patch
          git apply /tmp/mubasher-update.patch
      - name: Apply v1.4 home categories and software audio gain
        run: |
          xz -dc Mubasher-update-1.4.patch.xz > /tmp/mubasher-1.4.patch
          git apply --check /tmp/mubasher-1.4.patch
          git apply /tmp/mubasher-1.4.patch
      - name: Assert all nine visible category buttons
        run: |
          python3 - <<'PY'
          from xml.etree import ElementTree as ET
          tree = ET.parse('Mubasher/app/src/main/res/layout/home_screen.xml')
          ids = [node.attrib.get('{http://schemas.android.com/apk/res/android}id','')
                 for node in tree.getroot().iter()]
          assert sum(i.startswith('@+id/cat') for i in ids) == 9
          print('Verified 9 first-screen clickable category buttons')
          PY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Install Android platform
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
      - name: Test playlist catalog
        working-directory: Mubasher
        run: python3 -m unittest discover -s tests -v
      - name: Refresh public streams (Arabic first, global categories)
        working-directory: Mubasher
        run: python3 tools/refresh_channels.py
      - name: Count public stream listings
        working-directory: Mubasher
        run: grep -c '^#EXTINF:' app/src/main/assets/channels.m3u
      - name: Run Kotlin category tests and assemble debug APK
        working-directory: Mubasher
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mubasher-v1.4-debug-apk
          path: Mubasher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
